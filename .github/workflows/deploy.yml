name: Deploy Cima to Sparked

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cima-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SPARKED_SERVER_ID: 22ba77cf
      SPARKED_SFTP_HOST: v-slc-07.apollopanel.com
      SPARKED_SFTP_USER: xxyi4hpf.22ba77cf
      SPARKED_API_KEY: ${{ secrets.SPARKED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SFTP
        env:
          SPARKED_SFTP_KEY: ${{ secrets.SPARKED_SFTP_KEY }}
          SPARKED_KNOWN_HOSTS: ${{ secrets.SPARKED_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SPARKED_API_KEY"
          test -n "$SPARKED_SFTP_KEY"
          test -n "$SPARKED_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SPARKED_SFTP_KEY" > "$HOME/.ssh/cima_sparked"
          printf '%s\n' "$SPARKED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cima_sparked" "$HOME/.ssh/known_hosts"

      - name: Upload release
        run: |
          set -euo pipefail
          tar -czf /tmp/cima-release.tar.gz index.js deploy-commands.js package.json package-lock.json src
          printf 'put /tmp/cima-release.tar.gz cima-release.tar.gz\n' |
            sftp -q -b - -i "$HOME/.ssh/cima_sparked" -P 2022 \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$SPARKED_SFTP_USER@$SPARKED_SFTP_HOST"

      - name: Activate release
        run: |
          set -euo pipefail
          api="https://control.sparkedhost.us/api/client/servers/$SPARKED_SERVER_ID"
          auth="Authorization: Bearer $SPARKED_API_KEY"
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"signal":"stop"}' "$api/power"
          for attempt in $(seq 1 30); do
            state=$(curl -fsS -H "$auth" "$api/resources" | jq -r '.attributes.current_state')
            if [ "$state" = offline ]; then break; fi
            sleep 2
          done
          test "$state" = offline
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"root":"/","file":"cima-release.tar.gz"}' "$api/files/decompress"
          started_after=$(date -u +%s)
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"signal":"start"}' "$api/power"
          for attempt in $(seq 1 60); do
            state=$(curl -fsS -H "$auth" "$api/resources" | jq -r '.attributes.current_state')
            ready=$(curl -fsS -H "$auth" \
              "$api/files/contents?file=%2Fdata%2Fruntime-ready.json" 2>/dev/null || true)
            ready_at=$(printf '%s' "$ready" | jq -r '.startedAt // empty' 2>/dev/null || true)
            ready_user=$(printf '%s' "$ready" | jq -r '.userId // empty' 2>/dev/null || true)
            if [ "$state" = running ] && [ "$ready_user" = 1558272726177947679 ] && [ -n "$ready_at" ]; then
              ready_epoch=$(date -u -d "$ready_at" +%s)
              if [ "$ready_epoch" -ge "$started_after" ]; then
                echo "Cima connected to Discord on Sparked."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Cima did not become ready on Sparked (state: $state)." >&2
          exit 1
